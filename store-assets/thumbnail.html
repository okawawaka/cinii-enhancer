<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=440, height=280, initial-scale=1.0">
  <title>CiNii Research Enhancer - Thumbnail (440x280)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Noto+Sans+JP:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Noto Sans JP', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 440 x 280 Precise Store Thumbnail */
    .thumbnail {
      width: 440px;
      height: 280px;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 32px;
      gap: 22px;
      position: relative;
    }

    /* Top Accent Stripe (CiNii Blue) */
    .thumbnail::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background-color: #004098;
    }

    /* Left Logo */
    .logo {
      width: 104px;
      height: 104px;
      flex-shrink: 0;
    }

    /* Right Text Block */
    .text-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title-primary {
      font-size: 29px;
      font-weight: 800;
      color: #002b66;
      line-height: 1.15;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .title-secondary {
      font-size: 29px;
      font-weight: 800;
      color: #004098;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-top: 4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="thumbnail">
    <!-- Official CiNii Research Enhancer SVG Logo -->
    <svg class="logo" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ciniiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#003580"/>
          <stop offset="100%" stop-color="#001f4d"/>
        </linearGradient>
      </defs>
      <rect x="8" y="8" width="112" height="112" rx="2" fill="url(#ciniiGrad)"/>
      <path d="M34 26 H80 L94 40 V102 H34 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <path d="M80 26 V40 H94 Z" fill="#e2e8f0"/>
      <line x1="44" y1="46" x2="70" y2="46" stroke="#94a3b8" stroke-width="3"/>
      <line x1="44" y1="56" x2="84" y2="56" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="44" y1="64" x2="84" y2="64" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="44" y1="72" x2="72" y2="72" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="82" cy="82" r="18" fill="#004098" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M75 80 C75 76 77 74 80 74 V77 C78 77 77.5 78 77.5 80 H80 V85 H75 Z" fill="#ffffff"/>
      <path d="M83 80 C83 76 85 74 88 74 V77 C86 77 85.5 78 85.5 80 H88 V85 H83 Z" fill="#ffffff"/>
    </svg>

    <!-- Title Text -->
    <div class="text-block">
      <div class="title-primary">CiNii Research</div>
      <div class="title-secondary">Enhancer</div>
    </div>
  </div>

</body>
</html>
