<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, height=800, initial-scale=1.0">
  <title>CiNii Research Enhancer - 大プロモーション 1枚目</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+JP:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Noto Sans JP', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #1e293b;
    }

    .container {
      width: 1280px;
      height: 800px;
      display: grid;
      grid-template-columns: 560px 1fr;
      align-items: center;
      padding: 0 72px;
      gap: 56px;
      position: relative;
      background: #ffffff;
    }

    /* Top Accent Stripe */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 10px;
      background-color: #004098;
    }

    /* Left Area: High Visibility Text (Bullets & Bold Title) */
    .desc-area {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      color: #004098;
      letter-spacing: -0.01em;
    }

    .main-title {
      font-size: 58px;
      font-weight: 900;
      color: #002b66;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }

    .bullet-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 25px;
      font-weight: 700;
      color: #334155;
      line-height: 1.3;
    }

    .bullet-point {
      width: 10px;
      height: 10px;
      background-color: #004098;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Right Area: Large High-Contrast Settings Mock */
    .mock-wrapper {
      display: flex;
      justify-content: center;
    }

    .popup-mock {
      width: 530px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 2px;
      box-shadow: 0 16px 40px rgba(0, 43, 102, 0.1), 0 2px 6px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .mock-header {
      background: #002b66;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mock-header-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .mock-version {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }

    .mock-body {
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      background: #ffffff;
    }

    .setting-section-title {
      font-size: 15px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    .select-box {
      width: 100%;
      padding: 14px 18px;
      font-size: 18px;
      font-weight: 800;
      color: #004098;
      background: #f0f5fc;
      border: 2px solid #004098;
      border-radius: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .select-arrow {
      color: #004098;
      font-size: 14px;
    }

    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toggle-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 2px;
    }

    .toggle-name {
      font-size: 16px;
      font-weight: 800;
      color: #1e293b;
    }

    .toggle-desc {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }

    .toggle-status {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      background: #004098;
      padding: 4px 12px;
      border-radius: 2px;
    }

    .mock-btn-save {
      background: #004098;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 17px;
      font-weight: 800;
      border-radius: 2px;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Left Area: Short Bullets (40 characters total / under 50 chars) -->
    <div class="desc-area">
      <div class="brand-row">
        <svg class="brand-logo" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ciniiGradP1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#003580"/>
              <stop offset="100%" stop-color="#001f4d"/>
            </linearGradient>
          </defs>
          <rect x="8" y="8" width="112" height="112" rx="2" fill="url(#ciniiGradP1)"/>
          <path d="M34 26 H80 L94 40 V102 H34 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
          <path d="M80 26 V40 H94 Z" fill="#e2e8f0"/>
          <circle cx="82" cy="82" r="18" fill="#004098" stroke="#ffffff" stroke-width="2.5"/>
          <path d="M75 80 C75 76 77 74 80 74 V77 C78 77 77.5 78 77.5 80 H80 V85 H75 Z" fill="#ffffff"/>
          <path d="M83 80 C83 76 85 74 88 74 V77 C86 77 85.5 78 85.5 80 H88 V85 H83 Z" fill="#ffffff"/>
        </svg>
        <span class="brand-name">CiNii Research Enhancer</span>
      </div>

      <h1 class="main-title">ワンクリック<br>引用コピー</h1>

      <div class="bullet-list">
        <div class="bullet-item">
          <span class="bullet-point"></span>
          <span>優先形式を直接コピー</span>
        </div>
        <div class="bullet-item">
          <span class="bullet-point"></span>
          <span>BibTeX・APA・SIST02対応</span>
        </div>
      </div>
    </div>

    <!-- Right Area: Settings Screen Mock -->
    <div class="mock-wrapper">
      <div class="popup-mock">
        <div class="mock-header">
          <span class="mock-header-title">CiNii Enhancer 設定</span>
          <span class="mock-version">v1.0.0</span>
        </div>

        <div class="mock-body">
          <div>
            <div class="setting-section-title">クイックコピー優先フォーマット</div>
            <div class="select-box">
              <span>BibTeX (LaTeX / Typst)</span>
              <span class="select-arrow">▼</span>
            </div>
          </div>

          <div>
            <div class="setting-section-title">機能のオン/オフ</div>
            <div class="toggle-list">
              <div class="toggle-item">
                <div>
                  <div class="toggle-name">詳細画面の引用ツールバー</div>
                  <div class="toggle-desc">タイトル横に引用ボタンを配置</div>
                </div>
                <span class="toggle-status">有効</span>
              </div>
              <div class="toggle-item">
                <div>
                  <div class="toggle-name">検索結果の引用ボタン</div>
                  <div class="toggle-desc">一覧から直接ワンクリックコピー</div>
                </div>
                <span class="toggle-status">有効</span>
              </div>
            </div>
          </div>

          <div class="mock-btn-save">設定を保存</div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
