      <stop offset="0%" stop-color="#003580"/>
      <stop offset="100%" stop-color="#001f4d"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="url(#ciniiBg)"/>
  
